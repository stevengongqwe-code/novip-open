services:
  office:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      ALLOWED_ORIGINS: https://zhijian-handwrite.stevengongqwe.chatgpt.site
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
