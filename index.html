  <script>
  /* NOVIP ES5 boot guard: independent from module execution, React and local assets.
   * A successful React Root commit is NOT enough; the initial page must resolve. */
  (function () {
    var RELOAD_KEY = 'novip-reload-guard-v1';
    var RELOAD_WINDOW = 5 * 60 * 1000;
    var MAX_RELOADS = 2;
    function booted() { return window.__NOVIP_BOOTED === true; }
    function recovery() { return document.getElementById('novip-boot-recovery'); }
    function showFallback() {
      if (booted()) return;
      var el = recovery();
      if (el) el.style.display = 'block';
    }
    function signalSuccess() {
      window.__NOVIP_BOOTED = true;
      var el = recovery();
      if (el) el.style.display = 'none';
    }
    function showReloadLimit() {
      var el = document.getElementById('novip-boot-reload-limit');
      if (el) el.style.display = 'block';
      return false;
    }
    function guardedReload() {
      var now = new Date().getTime();
      var history = null;
      var storage = null;
      try {
        storage = window.sessionStorage;
        var raw = storage.getItem(RELOAD_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed.count === 'number' &&
              typeof parsed.first === 'number' && isFinite(parsed.count) &&
              isFinite(parsed.first) && parsed.count >= 0 && parsed.first >= 0) {
            history = parsed;
          }
        }
      } catch (ignored) { storage = null; }
      if (!history || now < history.first || now - history.first > RELOAD_WINDOW) {
        history = {count: 0, first: now};
      }
      if (history.count >= MAX_RELOADS) return showReloadLimit();
      history.count++;
      try { if (storage) storage.setItem(RELOAD_KEY, JSON.stringify(history)); }
      catch (ignored) { /* Storage may be denied; user-initiated reload remains possible. */ }
      window.location.reload();
      return true;
    }
    window.__NOVIP_BOOT_FALLBACK = showFallback;
    window.__NOVIP_BOOT_SUCCESS = signalSuccess;
    window.__NOVIP_GUARDED_RELOAD = guardedReload;
    window.addEventListener('error', function (event) {
      var target = event && event.target;
      if (target && target.tagName === 'SCRIPT' && !booted()) {
        window.setTimeout(showFallback, 800);
      }
    }, true);
    window.addEventListener('vite:preloadError', function () {
      if (!booted()) showFallback();
    }, false);
    window.setTimeout(function () {
      if (booted()) return;
      var el = document.getElementById('novip-boot-note');
      if (el) el.textContent = '加载时间较长，请检查网络连接…';
    }, 9000);
    window.setTimeout(showFallback, 20000);
  })();
  </script>
